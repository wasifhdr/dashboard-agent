<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>dashboard-agent host</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; }
  #viz { display: block; width: 1600px; height: 1000px; }
  /* Dev-only manual test panel. Not shown to end users; only used when this
     page is opened directly in a browser during Phase 0 development. */
  #devPanel {
    position: fixed; top: 0; right: 0; width: 380px; max-height: 100vh;
    overflow: auto; background: #111; color: #ddd; font: 12px monospace;
    padding: 10px; box-sizing: border-box; z-index: 9999; border-left: 1px solid #444;
  }
  #devPanel button { display: block; width: 100%; margin: 4px 0; padding: 6px; cursor: pointer; }
  #devPanel pre { white-space: pre-wrap; word-break: break-all; background: #000; padding: 6px; max-height: 300px; overflow: auto; }
  #devPanel.hidden { display: none; }
</style>
</head>
<body>
  <tableau-viz id="agentViz" hide-tabs toolbar="hidden"></tableau-viz>

  <div id="devPanel">
    <div><strong>dashboard-agent dev panel</strong> (add ?dev=1 to hide)</div>
    <button id="btnInventory">getInventory()</button>
    <button id="btnSwitchSheet">switchSheet(prompt)</button>
    <button id="btnCatFilter">applyCategoricalFilter(prompt)</button>
    <button id="btnRangeFilter">applyRangeFilter(prompt)</button>
    <button id="btnParam">setParameter(prompt)</button>
    <button id="btnEvents">getEventLog()</button>
    <pre id="devOut">(output appears here)</pre>
  </div>

  <script type="module">
    import {
      TableauEventType,
      FilterUpdateType,
    } from "https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.js";

    const params = new URLSearchParams(location.search);
    const vizUrl = params.get("viz");
    const devMode = params.get("dev") !== "0"; // dev panel visible by default

    const vizEl = document.getElementById("agentViz");

    // ---- bridge state -------------------------------------------------
    const eventLog = [];
    function logEvent(type) {
      eventLog.push({ type, ts: Date.now() });
    }

    window.__agentBridgeState = { interactive: false, loadError: null };

    let readyResolve, readyReject;
    const readyPromise = new Promise((res, rej) => {
      readyResolve = res;
      readyReject = rej;
    });

    vizEl.addEventListener(TableauEventType.FirstInteractive, async () => {
      // The dashboard's published size is usually smaller than our generous
      // default box (1600x1000), which would otherwise leave dead black
      // margin in every screenshot and waste image tokens the VLM needs for
      // reading fine print. Shrink the element to the sheet's real size when
      // it reports one (behavior !== "automatic").
      try {
        const size = vizEl.workbook.activeSheet.size;
        const target = size?.minSize || size?.maxSize;
        if (size && size.behavior !== "automatic" && target?.width && target?.height) {
          vizEl.style.width = `${target.width}px`;
          vizEl.style.height = `${target.height}px`;
          await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        }
      } catch (e) {
        // sizing is a cosmetic best-effort; never block readiness on it.
      }
      window.__agentBridgeState.interactive = true;
      readyResolve();
      // Start filling the domain cache now, in the background. Readiness is
      // resolved FIRST so this can never delay the agent - see warmDomainCache.
      warmDomainCache();
    });
    vizEl.addEventListener(TableauEventType.FilterChanged, () => logEvent("FilterChanged"));
    vizEl.addEventListener(TableauEventType.ParameterChanged, () => logEvent("ParameterChanged"));
    vizEl.addEventListener(TableauEventType.TabSwitched, () => {
      logEvent("TabSwitched");
      // A different tab has a different filter set; warm the new sheet's keys.
      warmDomainCache();
    });
    vizEl.addEventListener(TableauEventType.VizLoadError, (e) => {
      const msg = String(e?.detail?.message ?? "vizloaderror");
      window.__agentBridgeState.loadError = msg;
      readyReject(new Error(msg));
    });

    if (vizUrl) {
      vizEl.src = vizUrl;
    } else {
      window.__agentBridgeState.loadError = "no ?viz= URL provided";
    }

    // ---- helpers --------------------------------------------------------
    // Extracts a plain value from a Tableau DataValue-ish object.
    function plain(v) {
      if (v === null || v === undefined) return null;
      if (typeof v === "object") return v.formattedValue ?? v.nativeValue ?? v.value ?? null;
      return v;
    }

    // The active sheet is either a Dashboard (has .worksheets, dashboard-level
    // getFiltersAsync/applyFilterAsync) or a bare Worksheet (single-sheet viz).
    function activeContainer() {
      const sheet = vizEl.workbook.activeSheet;
      if (sheet.sheetType === "dashboard") {
        return { container: sheet, worksheets: sheet.worksheets, isDashboard: true };
      }
      return { container: sheet, worksheets: [sheet], isDashboard: false };
    }

    async function getRawFilters() {
      const { container, isDashboard, worksheets } = activeContainer();
      return isDashboard ? container.getFiltersAsync() : worksheets[0].getFiltersAsync();
    }

    // ---- domain cache -----------------------------------------------------
    // getDomainAsync() is the single most expensive thing the bridge does: the
    // Tableau API serializes the calls internally at ~0.8-1.1s each (measured;
    // Promise.all is no faster), and a dashboard reports one filter object per
    // WORKSHEET, not per field. Video Game Sales reports 51 filters covering 17
    // distinct fields, so the naive loop asks "what airports exist?"-style
    // questions up to 8x each: 28.2s of a ~30s agent step.
    //
    // Two fixes, both served by keying a Map on the PROMISE rather than the
    // value: repeats within one call collapse onto the first in-flight fetch
    // (dedup), and repeats across steps hit the resolved entry (cache).
    //
    // Cached values must not go stale. We therefore request the "database"
    // domain, which is the field's full underlying value list, instead of the
    // default "relevant" domain, which SHRINKS as other filters narrow the data
    // (verified: after filtering to Electronic Arts, Publisher's relevant
    // domain went 5 -> 1 while its database domain stayed 5). That makes the
    // cache correct with no invalidation, and it is also the better prompt
    // content - it tells the model a value exists even when currently filtered
    // out, which is exactly what it needs to plan a filter change.
    //
    // Keyed by sheet as well as field, because switching tabs changes the
    // filter set entirely.
    const domainCache = new Map();
    let domainCacheHits = 0;
    let domainCacheMisses = 0;

    function domainCacheKey(sheetName, fieldName) {
      return `${sheetName}\u0000${fieldName}`;
    }

    function isEmptyDomain(f, d) {
      if (!d) return true;
      if (f.filterType === "categorical") return !(d.values || []).length;
      if (f.filterType === "range") return d.min == null && d.max == null;
      return true;
    }

    // Always RESOLVES (never rejects) so a failed lookup is cached as "no
    // domain" rather than being retried on every step, and so one bad filter
    // cannot reject the whole warm-up.
    async function fetchDomain(f) {
      const result = { domain: null, domainRange: null };
      if (typeof f.getDomainAsync !== "function") return result;
      try {
        // "database" is what makes the cache safe; fall back to the default
        // (relevant) domain on API versions that reject the argument, AND when
        // it comes back EMPTY. Aggregate/calculated fields can have no database
        // domain at all while still having a usable relevant one - on US Flight
        // Delays, "AGG( Delay Categories )" returns 0 values for "database" but
        // 2 for the default. Falling back only on throw silently dropped those.
        let d = null;
        try {
          d = await f.getDomainAsync("database");
        } catch (e) {
          d = null;
        }
        if (isEmptyDomain(f, d)) {
          try {
            const fallback = await f.getDomainAsync();
            if (!isEmptyDomain(f, fallback)) d = fallback;
          } catch (e) {
            // keep whatever "database" gave us, even if empty
          }
        }
        if (!d) return result;
        if (f.filterType === "categorical") {
          result.domain = (d.values || []).map(plain);
        } else if (f.filterType === "range") {
          result.domainRange = { min: plain(d.min), max: plain(d.max) };
        }
      } catch (e) {
        // domain enumeration not available for this filter/API version.
      }
      return result;
    }

    function getDomainCached(sheetName, f) {
      const key = domainCacheKey(sheetName, f.fieldName);
      if (domainCache.has(key)) {
        domainCacheHits++;
        return domainCache.get(key);
      }
      domainCacheMisses++;
      const p = fetchDomain(f);
      domainCache.set(key, p);
      return p;
    }

    // Fire-and-forget warm-up. Deliberately NOT awaited by the caller: it costs
    // ~10s on a dashboard like Video Game Sales even after dedup, and blocking
    // readiness on it would just move the stall into the load. Run in the
    // background, it is usually finished before the user has typed a question,
    // and getInventory() falls back to a live fetch for anything not yet warm.
    function warmDomainCache() {
      (async () => {
        try {
          const sheetName = vizEl.workbook.activeSheet.name;
          const raw = await getRawFilters();
          for (const f of raw) await getDomainCached(sheetName, f);
        } catch (e) {
          // A Story has no getFiltersAsync; warm-up is best-effort everywhere.
        }
      })();
    }

    // ---- bridge methods ---------------------------------------------------
    async function getInventory() {
      const { container, worksheets, isDashboard } = activeContainer();
      const sheetName = vizEl.workbook.activeSheet.name;

      const rawFilters = await getRawFilters();
      const filters = [];
      for (const f of rawFilters) {
        const { domain, domainRange } = await getDomainCached(sheetName, f);

        filters.push({
          fieldName: f.fieldName,
          filterType: f.filterType,
          worksheetName: f.worksheetName,
          appliedValues: (f.appliedValues || []).map(plain),
          isAllSelected: f.isAllSelected ?? null,
          minValue: plain(f.minValue),
          maxValue: plain(f.maxValue),
          domain,
          domainRange,
        });
      }

      let parameters = [];
      try {
        const rawParams = await vizEl.workbook.getParametersAsync();
        parameters = rawParams.map((p) => ({
          name: p.name,
          dataType: p.dataType,
          currentValue: plain(p.currentValue),
          allowableType: p.allowableValues?.type ?? null,
          allowableValues: (p.allowableValues?.allowableValues || []).map(plain),
          minValue: plain(p.allowableValues?.minValue),
          maxValue: plain(p.allowableValues?.maxValue),
          stepSize: p.allowableValues?.stepSize ?? null,
        }));
      } catch (e) {
        // some vizzes have no parameters; leave empty.
      }

      const sheetsInfo = (vizEl.workbook.publishedSheetsInfo || []).map((s) => ({
        name: s.name,
        index: s.index,
        isActive: s.isActive,
        isHidden: s.isHidden,
        sheetType: s.sheetType,
      }));

      return {
        activeSheetName: container.name,
        isDashboard,
        worksheetNames: worksheets.map((w) => w.name),
        sheets: sheetsInfo,
        filters,
        parameters,
      };
    }

    async function applyCategoricalFilter(fieldName, values) {
      try {
        const { container, isDashboard, worksheets } = activeContainer();
        if (isDashboard) {
          await container.applyFilterAsync(fieldName, values, FilterUpdateType.Replace, { isExcludeMode: false });
        } else {
          await worksheets[0].applyFilterAsync(fieldName, values, FilterUpdateType.Replace, { isExcludeMode: false });
        }
        return { ok: true };
      } catch (e) {
        return { ok: false, error: String(e?.message ?? e) };
      }
    }

    async function applyRangeFilter(fieldName, min, max) {
      // Range filters have no dashboard-level broadcast method in the Embedding
      // API, so apply per-worksheet: target whichever worksheets already report
      // this field as a range filter, falling back to all worksheets.
      try {
        const { worksheets } = activeContainer();
        const rawFilters = await getRawFilters();
        const targetNames = new Set(
          rawFilters.filter((f) => f.fieldName === fieldName).map((f) => f.worksheetName),
        );
        const targets = targetNames.size > 0 ? worksheets.filter((w) => targetNames.has(w.name)) : worksheets;

        const results = [];
        for (const ws of targets) {
          try {
            await ws.applyRangeFilterAsync(fieldName, { min, max });
            results.push({ worksheet: ws.name, ok: true });
          } catch (e) {
            results.push({ worksheet: ws.name, ok: false, error: String(e?.message ?? e) });
          }
        }
        return { ok: results.some((r) => r.ok), results };
      } catch (e) {
        return { ok: false, error: String(e?.message ?? e) };
      }
    }

    async function setParameter(name, value) {
      try {
        await vizEl.workbook.changeParameterValueAsync(name, value);
        return { ok: true };
      } catch (e) {
        return { ok: false, error: String(e?.message ?? e) };
      }
    }

    async function switchSheet(nameOrIndex) {
      try {
        await vizEl.workbook.activateSheetAsync(nameOrIndex);
        return { ok: true };
      } catch (e) {
        return { ok: false, error: String(e?.message ?? e) };
      }
    }

    function getEventLog() {
      return eventLog.slice();
    }

    // Diagnostics for the domain cache - lets a test assert that a second
    // getInventory() actually served from cache instead of just being fast.
    function getDomainCacheStats() {
      return { entries: domainCache.size, hits: domainCacheHits, misses: domainCacheMisses };
    }

    window.__agentBridge = {
      ready: readyPromise,
      getInventory,
      applyCategoricalFilter,
      applyRangeFilter,
      setParameter,
      switchSheet,
      getEventLog,
      getDomainCacheStats,
    };

    // ---- dev-only manual test panel ---------------------------------------
    const devPanel = document.getElementById("devPanel");
    if (!devMode) devPanel.classList.add("hidden");
    const devOut = document.getElementById("devOut");
    function show(label, data) {
      devOut.textContent = `${label}\n` + JSON.stringify(data, null, 2);
      console.log(label, data);
    }
    document.getElementById("btnInventory").onclick = async () => show("getInventory()", await getInventory());
    document.getElementById("btnEvents").onclick = () => show("getEventLog()", getEventLog());
    document.getElementById("btnSwitchSheet").onclick = async () => {
      const name = prompt("Sheet name or index:");
      if (name == null) return;
      show("switchSheet()", await switchSheet(isNaN(Number(name)) ? name : Number(name)));
    };
    document.getElementById("btnCatFilter").onclick = async () => {
      const field = prompt("Field name:");
      if (field == null) return;
      const valuesRaw = prompt("Comma-separated values:");
      if (valuesRaw == null) return;
      show("applyCategoricalFilter()", await applyCategoricalFilter(field, valuesRaw.split(",").map((s) => s.trim())));
    };
    document.getElementById("btnRangeFilter").onclick = async () => {
      const field = prompt("Field name:");
      if (field == null) return;
      const min = Number(prompt("Min:"));
      const max = Number(prompt("Max:"));
      show("applyRangeFilter()", await applyRangeFilter(field, min, max));
    };
    document.getElementById("btnParam").onclick = async () => {
      const name = prompt("Parameter name:");
      if (name == null) return;
      const value = prompt("New value:");
      if (value == null) return;
      show("setParameter()", await setParameter(name, value));
    };
  </script>
</body>
</html>
